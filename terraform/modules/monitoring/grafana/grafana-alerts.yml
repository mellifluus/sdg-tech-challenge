# Unified alerting rules: mount at /etc/grafana/provisioning/alerting/grafana-alerts.yml.
# Expects a Prometheus datasource provisioned with `uid: prometheus`.
# Every rule follows the same shape: A = PromQL query, B = reduce(last), C = threshold.
apiVersion: 1

groups:
  - orgId: 1
    name: sdg-platform
    folder: SDG Platform
    interval: 1m
    rules:
      - uid: sdg-target-down
        title: Scrape target down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "up", instant: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: sdg-postgres-down
        title: PostgreSQL down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter reports PostgreSQL as unreachable (pg_up == 0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "pg_up", instant: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: sdg-postgres-connections
        title: PostgreSQL connections above 80%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL is using {{ humanizePercentage $values.B.Value }} of max_connections"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(pg_stat_database_numbackends) / max(pg_settings_max_connections)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: sdg-postgres-deadlocks
        title: PostgreSQL deadlocks detected
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks in database {{ $labels.datname }} over the last 5 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum by (datname) (increase(pg_stat_database_deadlocks[5m]))"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: sdg-minio-nodes-offline
        title: MinIO node offline
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $values.B.Value }} MinIO node(s) offline"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "max(minio_cluster_nodes_offline_total)", instant: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: sdg-minio-capacity
        title: MinIO free capacity below 10%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "MinIO has {{ humanizePercentage $values.B.Value }} usable capacity left"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "max(minio_cluster_capacity_usable_free_bytes) / max(minio_cluster_capacity_usable_total_bytes)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.1] }

      - uid: sdg-minio-s3-errors
        title: MinIO S3 error rate above 5%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ humanizePercentage $values.B.Value }} of S3 requests are failing"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # clamp_min avoids a division by zero on an idle cluster.
              expr: "sum(rate(minio_s3_requests_errors_total[5m])) / clamp_min(sum(rate(minio_s3_requests_total[5m])), 1e-9)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # Guards the challenge's validation requirement. Bucket usage comes from the MinIO
      # scanner, which can lag a few minutes after a fresh deploy, hence the long `for`.
      - uid: sdg-data-bucket-missing
        title: data-bucket missing
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "MinIO reports no usage metrics for bucket data-bucket"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(minio_bucket_usage_object_total{bucket="data-bucket"})'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

  # Airflow metrics come from the StatsD exporter. Heartbeats are counters, so a stalled
  # component shows up as a flat counter (or no series at all after an exporter restart).
  - orgId: 1
    name: sdg-airflow
    folder: SDG Platform
    interval: 1m
    rules:
      - uid: sdg-airflow-scheduler-down
        title: Airflow scheduler heartbeat missing
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The Airflow scheduler has not sent a heartbeat for 3+ minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(increase(airflow_scheduler_heartbeat[2m])) or vector(0)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: sdg-airflow-dag-processor-down
        title: Airflow DAG processor heartbeat missing
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The Airflow DAG processor has not sent a heartbeat for 3+ minutes; DAG changes are not picked up"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(increase(airflow_dag_processor_heartbeat[2m])) or vector(0)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: sdg-airflow-import-errors
        title: Airflow DAG import errors
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.B.Value }} DAG file(s) fail to import; check Browse > DAG import errors"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "sum(airflow_dag_processing_import_errors)", instant: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # StatsD counters only exist after their first event, so increase() would miss a DAG's
      # first-ever failure. Diffing against the 5m-old value (or 0 if the series is new)
      # catches it.
      - uid: sdg-airflow-dagrun-failed
        title: Airflow DAG run failed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $values.B.Value }} run(s) of DAG {{ $labels.dag_id }} failed in the last 5 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (dag_id) (clamp_min(airflow_dagrun_duration_failed_count
                - (airflow_dagrun_duration_failed_count offset 5m or airflow_dagrun_duration_failed_count * 0), 0))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: sdg-airflow-tasks-starving
        title: Airflow tasks starving for pool slots
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.B.Value }} task(s) in pool {{ $labels.pool_name }} cannot run for lack of slots"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: "sum by (pool_name) (airflow_pool_starving_tasks)", instant: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: sdg-airflow-executor-saturated
        title: Airflow executor saturated
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "LocalExecutor has no open slots and {{ $values.B.Value }} queued task(s)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Queued tasks only count while no slot is free.
              expr: "sum(airflow_executor_queued_tasks) and sum(airflow_executor_open_slots) == 0 or vector(0)"
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
